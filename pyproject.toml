[project]
dependencies = [
    "matplotlib",
    "numpy",
    "opencv-python",
    "scikit-image",
    "scipy"
]
name = "multibeam"
description = "multibeam sonar pre-processing"
requires-python = ">=3.12"
version = "1.0.0"

[project.optional-dependencies]
dev = [
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
multibeam = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
